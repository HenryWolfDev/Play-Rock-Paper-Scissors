<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Rock, Paper, Scissors</title>
  </head>
  <body>
    <main class="container">
      <section class="game-board">
        <!-- #region GAME-BOARD -->
        <div class="game">
          <div class="game-info">
            <div class="rounds">
              <span>Round:</span>
              <span id="current-round">1</span>
              <span>/</span>
              <span id="rounds">5</span>
            </div>
          </div>
          <div class="type-board">
            <div class="choice-content">
              <div class="choice">
                <span id="player-choice">🪨</span>
              </div>
              <span class="score" id="player-score">0</span>
            </div>

            <div class="choice-content">
              <div class="choice">
                <span class="score" id="computer-choice">❓</span>
              </div>
              <span class="score" id="computer-score">0</span>
            </div>
          </div>
          <div>
            <span
              class="game-comment"
              id="comment"
              data-original="Choose wisely"
              >Choose wisely.</span
            >
          </div>
          <div class="choice-bar">
            <button class="choice-btn" data-choice="Rock">🪨</button>
            <button class="choice-btn" data-choice="Paper">📃</button>
            <button class="choice-btn" data-choice="Scissors">✂️</button>
          </div>
        </div>
        <!--#endregion GAME-BOARD -->

        <div class="overlay hide">
          <div class="end-screen">
            <span id="end-comment"></span>
            <button id="restart-btn" class="btn">Neustarten</button>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <span>Copyright Henry</span>
    </footer>
    <script src="script.js" type="module"></script>
  </body>
</html>
